name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master

permissions:
  contents: write
  # This is needed for the github-actions[bot] to push to the gh-pages branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          keep_files: false
          # Optionally, you can set the destination branch
          publish_branch: gh-pages